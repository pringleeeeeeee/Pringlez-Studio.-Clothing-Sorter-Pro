name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'test' }}
          RELEASE_URL: ${{ github.event.release.html_url || 'https://github.com/pringleeeeeeee/Pringlez-Studio.-Clothing-Sorter-Pro/releases' }}
          RELEASE_ASSETS: ${{ toJson(github.event.release.assets) || '[]' }}
          RELEASE_DATE: ${{ github.event.release.published_at || '' }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          tag  = os.environ.get('RELEASE_TAG', 'Unknown')
          url  = os.environ.get('RELEASE_URL', '')
          date = os.environ.get('RELEASE_DATE', '')

          raw = os.environ.get('DISCORD_WEBHOOK', '')
          webhook = raw.encode('utf-8').lstrip(b'\xef\xbb\xbf').decode('utf-8').strip()
          webhook = webhook.replace('discordapp.com', 'discord.com')

          print(f'Tag: {tag}')
          print(f'Webhook length: {len(webhook)}')

          try:
              assets_raw = os.environ.get('RELEASE_ASSETS', '[]')
              assets = json.loads(assets_raw) if assets_raw and assets_raw != 'null' else []
              setup    = next((a['browser_download_url'] for a in assets if 'Setup' in a['name'] and a['name'].endswith('.exe')), None)
              portable = next((a['browser_download_url'] for a in assets if 'Setup' not in a['name'] and a['name'].endswith('.exe')), None)
          except Exception as e:
              print(f'Asset parse error: {e}')
              setup = portable = None

          dl_setup    = f'[Setup Installer]({setup})' if setup else ''
          dl_portable = f'[Portable EXE]({portable})' if portable else ''
          dl_line     = ' · '.join(filter(None, [dl_setup, dl_portable])) or f'[Download Here]({url})'

          embed = {
              'color': 9149430,
              'title': '\U0001f680 New Clothing Sorter Pro Update Available',
              'description': f'**Version {tag}** is now available!\n\n{dl_line}',
              'url': url,
              'footer': {'text': 'Clothing Sorter Pro • Pringlez Studio'},
          }
          if date:
              embed['timestamp'] = date

          payload = json.dumps({'embeds': [embed]})
          req = urllib.request.Request(
              webhook,
              data=payload.encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          try:
              urllib.request.urlopen(req)
              print('Discord notification sent!')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              print(f'HTTP {e.code}: {body}')
              raise
          PYEOF